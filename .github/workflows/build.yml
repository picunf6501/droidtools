name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Android SDK: $SDK"

          if [ ! -f "$SDK/platforms/android-36/android.jar" ] || [ ! -d "$SDK/build-tools/36.0.0" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          fi

          echo "sdk.dir=$SDK" > local.properties

      - name: Grant permissions
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Droidbubble-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
